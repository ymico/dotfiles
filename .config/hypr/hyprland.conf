# ==============================================================================
#  Hyprland Configuration - Black & White Monochrome Style
#  Configured for: ym1co (surf1k) | NVIDIA RTX 5060 | Fedora 44
# ==============================================================================

# ------------------------------------------------------------------------------
# Monitors (Configured according to your dual-monitor setup)
# ------------------------------------------------------------------------------
# DP-2 (MSI MAG 275QF): 2560x1440 @ 180Hz (Primary, Right)
monitor = DP-2, 2560x1440@180, 1920x0, 1
# HDMI-A-2 (Samsung S24R35x): 1920x1080 @ 74.97Hz (Secondary, Left)
monitor = HDMI-A-2, 1920x1080@74.97, 0x0, 1
# Fallback for any other output
monitor = , preferred, auto, 1

# ------------------------------------------------------------------------------
# NVIDIA & Wayland Environment Variables (RTX 5060 Driver Optimizations)
# ------------------------------------------------------------------------------
env = PATH,$HOME/.local/bin:$HOME/bin:/usr/local/bin:/usr/bin:/bin
env = AQ_DRM_DEVICES,/dev/dri/card2
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
# env = GBM_BACKEND,nvidia-drm # Deprecated in newer Hyprland, can cause crashes
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
# NVIDIA Shader Cache & Performance (Eliminates CS2 stutters over time)
env = __GL_SHADER_DISK_CACHE,1
env = __GL_SHADER_DISK_CACHE_SIZE,10737418240
env = __GL_SHADER_DISK_CACHE_SKIP_CLEANUP,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland
env = GTK_THEME,adw-gtk3-dark
env = ADW_DEBUG_COLOR_SCHEME,prefer-dark
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LD_LIBRARY_PATH,$HOME/.local/lib64:$LD_LIBRARY_PATH
env = GHOSTTY_RESOURCES_DIR,$HOME/.local/share/ghostty

# ------------------------------------------------------------------------------
# Autostart Programs
# ------------------------------------------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP &
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP &
exec-once = systemctl --user start hyprland-session.service &
exec-once = swww-daemon &
exec-once = ~/.local/bin/waybar-wrapper &
exec-once = ~/.local/bin/swaybg-wrapper &
exec-once = ~/.local/bin/nvibrant 1023 1023 &
exec-once = ~/.local/bin/start-swaync &
exec-once = lxpolkit &
exec-once = wl-paste --type text --watch cliphist store &
exec-once = wl-paste --type image --watch cliphist store &
exec-once = /home/ym1co/.local/bin/ghostty --initial-window=false &
exec-once = /home/ym1co/.local/bin/custom-sound-mixer &

# ------------------------------------------------------------------------------
# Input Devices
# ------------------------------------------------------------------------------
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle,compose:ralt,ctrl:nocaps
    numlock_by_default = true
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

cursor {
    no_hardware_cursors = false
    enable_hyprcursor = true
    warp_on_change_workspace = true
}

# ------------------------------------------------------------------------------
# Pixel Art Monochrome Theme & Appearance
# ------------------------------------------------------------------------------
# Dynamic Theme Colors
$active_border = rgba(ffffffff)
$inactive_border = rgba(1c1c1cff)
source = /home/ym1co/.config/hypr/colors.conf

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border = $active_border
    col.inactive_border = $inactive_border

    layout = dwindle
    allow_tearing = true
}

xwayland {
    force_zero_scaling = true
}

decoration {
    # Pure 0px pixel corners for authentic retro pixel-art aesthetic
    rounding = 0

    active_opacity = 0.98
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 4
        passes = 1
        new_optimizations = true
        xray = false
    }

    # Authentic hard block pixel drop-shadow
    shadow {
        enabled = true
        range = 0
        render_power = 1
        offset = 4 4
        color = rgba(000000dd)
        color_inactive = rgba(00000099)
    }
}

animations {
    enabled = true

    # High-impact retro / mechanical beziers
    bezier = impact, 0.16, 1.18, 0.28, 1.02
    bezier = overshot, 0.05, 0.95, 0.1, 1.08
    bezier = smoothOut, 0.25, 1, 0.5, 1
    bezier = snap, 0.2, 1.2, 0.25, 1
    bezier = decel, 0.05, 0.7, 0.1, 1
    bezier = linear, 0, 0, 1, 1

    # Windows animations (punchy pop-in & snappy move)
    animation = windows, 1, 3.2, impact, popin 80%
    animation = windowsIn, 1, 3.0, impact, popin 80%
    animation = windowsOut, 1, 2.0, smoothOut, popin 85%
    animation = windowsMove, 1, 3.2, overshot

    # Fades & borders
    animation = fadeIn, 1, 2.0, smoothOut
    animation = fadeOut, 1, 1.8, smoothOut
    animation = fade, 1, 2.2, smoothOut
    animation = border, 1, 2.0, impact

    # Layer animations (impactful drop-down for sound mixer & notification center)
    animation = layers, 1, 3.2, snap, slide top
    animation = layersIn, 1, 3.5, snap, slide top
    animation = layersOut, 1, 2.0, smoothOut, slide top

    # Workspace transitions (smooth glide with subtle fade)
    animation = workspaces, 1, 3.2, overshot, slidefade 15%
    animation = specialWorkspace, 1, 3.0, impact, slidefadevert 15%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 2
}

render {
    direct_scanout = 1
}

debug {
    disable_logs = false
}

# ------------------------------------------------------------------------------
# Window Rules
# ------------------------------------------------------------------------------
# Layer Rules (Animations & Blurs)
layerrule = animation slide top, custom-sound-mixer
layerrule = blur, custom-sound-mixer
layerrule = ignorealpha 0.5, custom-sound-mixer

# SwayNC notifications & control center (no blur to avoid dark overlays over the screen)
layerrule = animation slide top, swaync-control-center
layerrule = animation slide top, swaync-notification-window

# Screenshot selection overlay (no animations to avoid sliding/fading artifacts captured in screenshots)
layerrule = noanim, selection
layerrule = noanim, slurp


windowrulev2 = float, class:^(custom-sound-mixer)$
windowrulev2 = size 460 520, class:^(custom-sound-mixer)$
windowrulev2 = move 100%-480 44, class:^(custom-sound-mixer)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = size 560 480, class:^(pavucontrol)$
windowrulev2 = size 560 480, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = move 100%-580 44, class:^(pavucontrol)$
windowrulev2 = move 100%-580 44, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(boiler)$
windowrulev2 = float, title:^(lines)$
windowrulev2 = float, class:^(hyprland-share-picker)$
windowrulev2 = pin, class:^(hyprland-share-picker)$
windowrulev2 = center, class:^(hyprland-share-picker)$
windowrulev2 = noblur, class:^(ghostty)$
windowrulev2 = noblur, class:^(com.mitchellh.ghostty)$
windowrulev2 = opacity 1.0 1.0, class:^(ghostty)$
windowrulev2 = opacity 1.0 1.0, class:^(com.mitchellh.ghostty)$

# Gaming optimizations (CS2, Steam, Proton, Roblox, Minecraft)
windowrulev2 = immediate, class:^(cs2)$
windowrulev2 = fullscreen, class:^(cs2)$
windowrulev2 = immediate, class:^(steam_app_.*)
windowrulev2 = fullscreen, class:^(steam_app_.*)
windowrulev2 = immediate, class:^(gamescope)
windowrulev2 = immediate, class:^(Minecraft.*)
windowrulev2 = float, class:^(gg-dawn-launcher-desktop-MainKt)$
windowrulev2 = size 1640 960, class:^(gg-dawn-launcher-desktop-MainKt)$
windowrulev2 = center, class:^(gg-dawn-launcher-desktop-MainKt)$
windowrulev2 = float, class:^(steam)$, title:^(Friends List.*)$
windowrulev2 = float, class:^(steam)$, title:^(Steam Settings.*)$

# ------------------------------------------------------------------------------
# Keybindings (From user's Niri dotfiles & custom workflow)
# ------------------------------------------------------------------------------
$mainMod = SUPER
$terminal = /home/ym1co/.local/bin/ghostty

# Application Launches
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, T, exec, ~/.local/bin/switch-theme
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, Q, killactive,
bind = $mainMod, L, exec, ~/.config/rofi/powermenu.sh
bind = $mainMod, N, exec, nautilus
bind = $mainMod, O, exec, ~/.local/bin/obsidian
bind = $mainMod SHIFT, Z, exec, ~/.local/bin/restart-zen
bind = $mainMod, M, exec, ~/.local/bin/yt-music
bind = $mainMod, Y, exec, $terminal --title=lines -e ~/.local/bin/lines
bind = $mainMod, B, exec, $terminal --title=boiler -e ~/.local/bin/boiler
bind = $mainMod SHIFT, W, exec, pkill -SIGUSR1 waybar
bind = $mainMod, E, exec, $terminal --title=nvim -e nvim
bind = $mainMod, P, exec, ~/.local/bin/study-quiz
bind = $mainMod SHIFT, P, exec, ~/.local/bin/cross-quiz

# Screenshots & Instant Replay
bind = $mainMod SHIFT, S, exec, ~/.local/bin/screenshot
bind = , Print, exec, ~/.local/bin/screenshot --full
bind = $mainMod, F10, exec, ~/.local/bin/save-replay
bind = CTRL, F10, exec, ~/.local/bin/save-replay
bind = ALT, F10, exec, ~/.local/bin/save-replay

# Audio & Microphone Toggles
bind = , Page_Down, exec, ~/.local/bin/toggle-mic
bind = , Page_Up, exec, ~/.local/bin/toggle-audio

# Window Layout Controls
bind = $mainMod, SPACE, togglefloating,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0

# Focus Navigation (Arrows + Vim keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
# Note: $mainMod, L is mapped to Power Menu to preserve Niri workflow. Use Right or Ctrl+L for right movement.

# Move Active Window
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d
bind = $mainMod CTRL, H, movewindow, l
bind = $mainMod CTRL, J, movewindow, d
bind = $mainMod CTRL, K, movewindow, u
bind = $mainMod CTRL, L, movewindow, r

# Monitor Focus Navigation
bind = $mainMod SHIFT, left, focusmonitor, l
bind = $mainMod SHIFT, right, focusmonitor, r
bind = $mainMod SHIFT, up, focusmonitor, u
bind = $mainMod SHIFT, down, focusmonitor, d
bind = $mainMod SHIFT, H, focusmonitor, l
bind = $mainMod SHIFT, J, focusmonitor, d
bind = $mainMod SHIFT, K, focusmonitor, u
bind = $mainMod SHIFT, L, focusmonitor, r

# Move Window to Monitor
bind = $mainMod SHIFT CTRL, left, movewindow, mon:l
bind = $mainMod SHIFT CTRL, right, movewindow, mon:r
bind = $mainMod SHIFT CTRL, up, movewindow, mon:u
bind = $mainMod SHIFT CTRL, down, movewindow, mon:d

# Workspaces (1 - 9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9

# Mouse Binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Hardware Media & Volume Keys (PipeWire / WirePlumber)
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ -l 1.0
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindl = , XF86AudioPlay, exec, /home/ym1co/.local/bin/media-ctl play-pause
bindl = , XF86AudioPause, exec, /home/ym1co/.local/bin/media-ctl play-pause
bindl = , XF86AudioNext, exec, /home/ym1co/.local/bin/media-ctl next
bindl = , XF86AudioPrev, exec, /home/ym1co/.local/bin/media-ctl previous
bindl = , XF86AudioStop, exec, /home/ym1co/.local/bin/media-ctl stop
